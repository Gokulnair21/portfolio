<section class="console" aria-label="Terminal console">
  <header class="console-header">
    <span class="console-title">TERMINAL CONSOLE</span>
    <span class="console-count">{{ store.logs().length }} ENTRIES</span>
  </header>
  @if (store.logs().length === 0) {
    <p class="console-empty">NO LOG OUTPUT — AWAITING STREAM</p>
  } @else {
    <div #viewport class="console-viewport">
      @for (entry of store.logs(); track $index) {
        <p class="log-row">
          <span class="log-timestamp">{{ entry.timestamp }}</span>
          <span class="log-source">[{{ entry.source }}]</span>
          <span class="log-level" [class]="levelClass(entry.level)">{{ entry.level }}</span>
          <span class="log-message">{{ entry.message }}</span>
        </p>
      }
    </div>
  }
</section>
