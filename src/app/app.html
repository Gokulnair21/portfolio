<div class="shell">
  <header class="header">
    <span class="status-dot" aria-hidden="true"></span>
    <h1 class="title">{{ serviceTitle() }}</h1>
    <span
      class="status-badge"
      [class]="'status-badge status-' + statusLabel().toLowerCase()"
      >{{ statusLabel() }}</span
    >
  </header>
  <nav class="tab-bar" role="tablist" aria-label="Dashboard sections">
    @for (tab of tabs; track tab.id) {
      <button
        type="button"
        role="tab"
        class="tab-button"
        [class.tab-active]="store.selectedTab() === tab.id"
        [attr.aria-selected]="store.selectedTab() === tab.id"
        (click)="store.selectTab(tab.id)"
      >
        {{ tab.label }}
      </button>
    }
  </nav>
  <main class="panel-area" aria-label="Dashboard panels">
    @switch (store.selectedTab()) {
      @case ('health-dashboard') {
        <section class="panel">
          <p class="panel-placeholder panel-placeholder-info">HEALTH MODULE DEPLOYING</p>
        </section>
      }
      @default {
        <section class="panel">
          <p class="panel-placeholder">MODULE NOT DEPLOYED</p>
        </section>
      }
    }
  </main>
</div>
