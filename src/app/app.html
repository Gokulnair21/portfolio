<div class="shell">
  <header class="header">
    <span class="status-dot" aria-hidden="true"></span>
    <h1 class="title">{{ serviceTitle() }}</h1>
    <span
      class="status-badge"
      [class]="'status-badge status-' + statusLabel().toLowerCase()"
      >{{ statusLabel() }}</span
    >
  </header>
  <main class="panel-area" aria-label="Dashboard panels"></main>
</div>
